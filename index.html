<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Barça Fan Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#181733; --navy-deep:#0A0927; --card:#1F1D45; --blau:#154284; --grana:#CD122D; --groc:#FDC52C; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--navy); color: #fff; font-family: 'Barlow', Arial, sans-serif; }
  .stripe { height: 6px; background: linear-gradient(90deg, var(--blau) 0 50%, var(--grana) 50% 100%); }
  main { min-height: calc(100vh - 6px); display: grid; place-items: center; padding: 32px 16px;
    background: radial-gradient(ellipse at 15% 0%, rgba(21,66,132,.55), transparent 60%), radial-gradient(ellipse at 85% 100%, rgba(205,18,45,.35), transparent 60%), var(--navy-deep); }
  form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid rgba(255,255,255,.1); border-top: 4px solid var(--blau); border-radius: 16px; padding: 32px 28px; display: grid; gap: 16px; }
  h1 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 1.9rem; line-height: 1.05; margin: 0; text-wrap: balance; }
  h1 span { color: var(--groc); }
  p { margin: 0; color: rgba(255,255,255,.7); font-size: .95rem; }
  label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .85rem; color: rgba(255,255,255,.8); }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: var(--navy-deep); color: #fff; font-size: 1rem; font-family: inherit; }
  input:focus { outline: 2px solid var(--groc); outline-offset: 1px; border-color: transparent; }
  button { padding: 12px 14px; border: 0; border-radius: 10px; background: var(--groc); color: var(--navy); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  button[disabled] { opacity: .6; cursor: wait; }
  .error { color: #ff8a9a; font-size: .9rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="stripe"></div>
<main>
  <form id="login" autocomplete="off">
    <h1>Experiència dels fans <span>FC Barcelona</span></h1>
    <p>Aquest contingut és d'accés restringit. Introdueix la contrasenya per veure'l.</p>
    <div style="display:grid;gap:6px">
      <label for="pw">Contrasenya</label>
      <input id="pw" type="password" required autofocus>
    </div>
    <button id="go" type="submit">Accedir</button>
    <div id="err" class="error" role="alert"></div>
  </form>
</main>

  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function decrypt(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(DATA.iv) }, key, unb64(DATA.ct));
    return new TextDecoder().decode(pt);
  }
  document.getElementById('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Comprovant…'; err.textContent = '';
    try {
      const html = await decrypt(document.getElementById('pw').value);
      document.open(); document.write(html); document.close();
      if (document.readyState === 'complete') window.dispatchEvent(new Event('load'));
    } catch {
      err.textContent = 'Contrasenya incorrecta. Torna-ho a provar.';
      btn.disabled = false; btn.textContent = 'Accedir';
